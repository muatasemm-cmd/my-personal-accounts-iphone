<!doctype html><meta charset="utf-8"><title>اختبارات حساباتي</title><pre id="out"></pre><script>
(async()=>{const results=[];const test=(name,ok)=>{if(!ok)throw new Error(name);results.push(`✓ ${name}`)};
const inCycle=(d,s,e)=>d>=s&&(!e||d<e);
test("تغيّر يوم الراتب",inCycle("2026-08-28","2026-07-28","2026-08-29")&&inCycle("2026-08-29","2026-08-29","2026-09-30")&&!inCycle("2026-09-30","2026-08-29","2026-09-30"));
const addMonth=(text)=>{const d=new Date(`${text}T12:00:00`),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+1,1,12),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};
test("تكرار 31 يناير",addMonth("2026-01-31")==="2026-02-28");
test("التحويل لا يغير الإجمالي",(1000-250)+(250)===1000);
const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),material=await crypto.subtle.importKey("raw",new TextEncoder().encode("secret1"),"PBKDF2",false,["deriveKey"]),key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:1000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]),raw=new TextEncoder().encode('{"balance":2200}'),enc=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,raw),dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,enc);
test("تشفير واستعادة النسخة",new TextDecoder().decode(dec)==='{"balance":2200}');
document.getElementById("out").textContent=results.join("\n")+"\n\nكل الاختبارات نجحت";
})().catch(e=>{document.getElementById("out").textContent=`فشل: ${e.message}`;document.body.dataset.failed="1"});
</script>
